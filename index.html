<div id="floatingUI"></div>
<script>
const floatingUI = document.getElementById('floatingUI');

// Array of Font Awesome music icon classes
const musicIcons = [
  'fa-solid fa-music',
  'fa-solid fa-headphones',
  'fa-solid fa-record-vinyl',
  'fa-solid fa-guitar',
  'fa-solid fa-drum'
];



function createFlower(){
  const flower = document.createElement('div');
  flower.className = 'floating-flower';

  flower.style.backgroundImage = "url('images/flower2.png')";
  flower.style.left = Math.random() * 100 + 'vw';
  flower.style.animationDuration = (Math.random() * 8 + 6) + 's';
  flower.style.transform = `scale(${Math.random() * 0.8 + 0.4})`;

  floatingUI.appendChild(flower);

  setTimeout(() => flower.remove(),
    parseFloat(flower.style.animationDuration) * 1000
  );
}

// spawn every 1.2s
setInterval(createFlower, 1800);



function createBubble() {
  const bubble = document.createElement('i'); // create an <i> element for FA
  bubble.className = musicIcons[Math.floor(Math.random() * musicIcons.length)] + ' floating-bubble';

  const size = Math.random() * 10 + 6; // 12px–32px
  bubble.style.fontSize = `${size}px`;
  bubble.style.left = `${Math.random() * 100}vw`;
  bubble.style.animationDuration = `${Math.random() * 8 + 5}s`; // 5-13s
  bubble.style.color = 'white';
  bubble.style.position = 'absolute';
  bubble.style.pointerEvents = 'none';
  bubble.style.opacity = 0.6;

  floatingUI.appendChild(bubble);

  // Remove after animation ends
  setTimeout(() => bubble.remove(), parseFloat(bubble.style.animationDuration) * 1000);
}

// Continuously create bubbles
setInterval(createBubble, 500); // every 0.5s
</script>

<style>
  /* About Modal */
.modal {
  display: none;
  position: fixed;
  z-index: 2000;
  left: 0;
  top: 0;
  width: 100%;
  height: 100%;
  overflow: auto;
  background-color: rgba(0,0,0,0.6);
}

.modal-content {
  background: var(--card);
  margin: 10% auto;
  padding: 20px;
  border-radius: 12px;
  width: 90%;
  max-width: 400px;
  color: inherit;
  text-align: center;
  box-shadow: 0 10px 30px rgba(0,0,0,0.5);
}

.modal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.modal-header h3 {
  margin: 0;
  color: var(--accent);
}

.close {
  font-size: 1.5rem;
  cursor: pointer;
  color: var(--accent);
}

.about-logo {
  width: 120px;
  height: 120px;
  object-fit: cover;
  border-radius: 50%;
  border: 2px solid var(--accent);
  margin: 15px 0;
}

.modal-body p {
  font-size: 14px;
  line-height: 1.5;
  color: inherit;
}

</style>
<!-- About Modal -->
<div id="aboutModal" class="modal">
  <div class="modal-content">
    <div class="modal-header">
      <h3>About</h3>
      <span id="closeAbout" class="close">&times;</span>
    </div>
    <div class="modal-body">
      <img src="images/flins.jpg" alt="Website Logo" class="about-logo">
      <p>Wala lang.</p>
    </div>
  </div>
</div>

<script>
  // About modal
const aboutBtn = document.querySelector('.sidebar ul li:nth-child(2)');
const aboutModal = document.getElementById('aboutModal');
const closeAbout = document.getElementById('closeAbout');

aboutBtn.addEventListener('click', () => {
  aboutModal.style.display = 'block';
});

closeAbout.addEventListener('click', () => {
  aboutModal.style.display = 'none';
});

// Close modal if clicked outside content
window.addEventListener('click', (e) => {
  if(e.target == aboutModal){
    aboutModal.style.display = 'none';
  }
});

</script>


<!-- Overlay -->
<div id="sidebarOverlay"></div>
<script>
  // ===== Sidebar Toggle =====
  const sidebar = document.getElementById('sidebar');
  const toggleBtn = document.querySelector('.toggle-btn');
  const closeBtn = document.getElementById('closeBtn');
  const sidebarOverlay = document.getElementById('sidebarOverlay');

  toggleBtn.addEventListener('click', () => {
    sidebar.classList.add('active');
    toggleBtn.style.display = 'none';
  });

  closeBtn.addEventListener('click', () => {
    sidebar.classList.remove('active');
    toggleBtn.style.display = 'block';
  });

  // Close sidebar if clicked outside
  sidebarOverlay.addEventListener('click', () => {
    sidebar.classList.remove('active');
    toggleBtn.style.display = 'block';
  });

  // ===== Settings Modal =====
  const settingsModal = document.getElementById('settingsModal');
  const closeSettings = document.getElementById('closeSettings');
  const saveSettings = document.getElementById('saveSettings');
  const fontSelect = document.getElementById('fontSelect');

  // Open modal when clicking Settings in sidebar
  const settingsBtn = document.querySelector('.sidebar ul li i.fa-cog').parentElement;
  settingsBtn.addEventListener('click', () => {
    settingsModal.style.display = 'flex';
  });

  // Close modal
  closeSettings.addEventListener('click', () => {
    settingsModal.style.display = 'none';
  });

  // Save font choice
  saveSettings.addEventListener('click', () => {
    const selectedFont = fontSelect.value;
    document.body.style.fontFamily = selectedFont;
    localStorage.setItem('fontFamily', selectedFont);
    settingsModal.style.display = 'none';
  });

  // Load saved font on page load
  const savedFont = localStorage.getItem('fontFamily');
  if(savedFont){
    document.body.style.fontFamily = savedFont;
    fontSelect.value = savedFont;
  }

  // Close modal if click outside content
  settingsModal.addEventListener('click', e => {
    if(e.target === settingsModal) settingsModal.style.display = 'none';
  });
</script>
