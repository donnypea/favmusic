<!doctype html>
<html lang="en">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Otokoi Gallery</title>

  <link
    rel="icon"
    type="image/png"
    href="images/music.png"
  >

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
  >

  <style>

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;

      font-family: system-ui, sans-serif;

      color: white;

      background:
        linear-gradient(
          rgba(0, 0, 0, 0.55),
          rgba(0, 0, 0, 0.78)
        ),
        url("images/flins.jpg")
        center / cover fixed;

      padding: 30px;
    }


    /* ================================
       MAIN CONTAINER
    ================================= */

    .gallery-container {

      width: 100%;

      max-width: 1200px;

      margin: 0 auto;

    }


    /* ================================
       HEADER
    ================================= */

    .gallery-header {

      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 20px;

      margin-bottom: 30px;

      flex-wrap: wrap;

    }


    .gallery-title {

      margin: 0;

      font-size: 32px;

      font-weight: 700;

      text-shadow:
        0 3px 15px
        rgba(0, 0, 0, 0.5);

    }


    .gallery-title i {

      color: #a78bfa;

      margin-right: 8px;

    }


    .gallery-actions {

      display: flex;

      gap: 10px;

      flex-wrap: wrap;

    }


    /* ================================
       BUTTONS
    ================================= */

    button,
    .back-button {

      border: none;

      outline: none;

      text-decoration: none;

      cursor: pointer;

      padding: 12px 18px;

      border-radius: 10px;

      font-size: 14px;

      font-family: inherit;

      color: white;

      background:
        rgba(255, 255, 255, 0.12);

      backdrop-filter: blur(10px);

      -webkit-backdrop-filter: blur(10px);

      transition:
        background 0.2s,
        transform 0.2s,
        box-shadow 0.2s;

    }


    button:hover,
    .back-button:hover {

      background:
        rgba(255, 255, 255, 0.22);

      transform:
        translateY(-2px);

      box-shadow:
        0 8px 20px
        rgba(0, 0, 0, 0.25);

    }


    button:active,
    .back-button:active {

      transform:
        translateY(0);

    }


    .upload-button {

      background:
        #8b5cf6;

    }


    .upload-button:hover {

      background:
        #7c3aed;

    }


    .back-button {

      display: inline-flex;

      align-items: center;

      gap: 8px;

    }


    /* ================================
       GALLERY
    ================================= */

    .gallery {

      display: grid;

      grid-template-columns:
        repeat(
          auto-fill,
          minmax(220px, 1fr)
        );

      gap: 18px;

    }


    /* ================================
       GALLERY ITEM
    ================================= */

    .gallery-item {

      position: relative;

      overflow: hidden;

      aspect-ratio: 1 / 1;

      border-radius: 15px;

      background:
        rgba(255, 255, 255, 0.08);

      box-shadow:
        0 10px 30px
        rgba(0, 0, 0, 0.35);

      cursor: pointer;

      animation:
        galleryAppear 0.4s ease;

    }


    @keyframes galleryAppear {

      from {

        opacity: 0;

        transform:
          translateY(10px);

      }

      to {

        opacity: 1;

        transform:
          translateY(0);

      }

    }


    .gallery-item img {

      width: 100%;

      height: 100%;

      display: block;

      object-fit: cover;

      transition:
        transform 0.35s ease,
        filter 0.35s ease;

    }


    .gallery-item:hover img {

      transform:
        scale(1.07);

      filter:
        brightness(0.8);

    }


    /* ================================
       IMAGE OVERLAY
    ================================= */

    .image-overlay {

      position: absolute;

      inset: 0;

      display: flex;

      align-items: center;

      justify-content: center;

      opacity: 0;

      background:
        rgba(0, 0, 0, 0.25);

      transition:
        opacity 0.25s;

    }


    .gallery-item:hover
    .image-overlay {

      opacity: 1;

    }


    .image-overlay i {

      font-size: 30px;

      color: white;

      filter:
        drop-shadow(
          0 2px 5px
          rgba(0, 0, 0, 0.5)
        );

    }


    /* ================================
       EMPTY GALLERY
    ================================= */

    .empty-gallery {

      grid-column: 1 / -1;

      text-align: center;

      padding: 80px 20px;

      background:
        rgba(255, 255, 255, 0.08);

      border:
        1px solid
        rgba(255, 255, 255, 0.08);

      border-radius: 15px;

      backdrop-filter:
        blur(10px);

      -webkit-backdrop-filter:
        blur(10px);

    }


    .empty-gallery i {

      display: block;

      font-size: 55px;

      color: #a78bfa;

      opacity: 0.7;

      margin-bottom: 18px;

    }


    .empty-gallery h2 {

      margin:
        0 0 8px;

    }


    .empty-gallery p {

      margin: 0;

      opacity: 0.7;

    }


    /* ================================
       LOADING
    ================================= */

    .loading-gallery {

      grid-column: 1 / -1;

      text-align: center;

      padding: 80px 20px;

      opacity: 0.8;

    }


    .loading-gallery i {

      font-size: 40px;

      color: #a78bfa;

      animation:
        spin 1s linear infinite;

    }


    @keyframes spin {

      to {

        transform:
          rotate(360deg);

      }

    }


    /* ================================
       MODAL
    ================================= */

    .modal {

      display: none;

      position: fixed;

      inset: 0;

      z-index: 1000;

      align-items: center;

      justify-content: center;

      padding: 20px;

      background:
        rgba(0, 0, 0, 0.75);

      backdrop-filter:
        blur(5px);

      -webkit-backdrop-filter:
        blur(5px);

    }


    .modal.active {

      display: flex;

    }


    .modal-box {

      width: 100%;

      max-width: 420px;

      padding: 25px;

      border-radius: 16px;

      background: #171717;

      border:
        1px solid
        rgba(255, 255, 255, 0.08);

      box-shadow:
        0 20px 60px
        rgba(0, 0, 0, 0.6);

      animation:
        modalAppear 0.2s ease;

    }


    @keyframes modalAppear {

      from {

        opacity: 0;

        transform:
          scale(0.95);

      }

      to {

        opacity: 1;

        transform:
          scale(1);

      }

    }


    .modal-box h2 {

      margin:
        0 0 10px;

      font-size: 22px;

    }


    .modal-box h2 i {

      color: #a78bfa;

      margin-right: 6px;

    }


    .modal-box p {

      margin-top: 0;

      opacity: 0.7;

      line-height: 1.5;

    }


    /* ================================
       PASSWORD
    ================================= */

    .password-input {

      width: 100%;

      padding: 13px 14px;

      border: none;

      outline: none;

      border-radius: 10px;

      background: #292929;

      color: white;

      font-family: inherit;

      font-size: 15px;

      margin:
        10px 0 15px;

      box-shadow:
        inset 0 0 0 1px
        rgba(255, 255, 255, 0.05);

    }


    .password-input:focus {

      box-shadow:
        inset 0 0 0 2px
        #8b5cf6;

    }


    /* ================================
       FILE INPUT
    ================================= */

    .file-input {

      width: 100%;

      margin:
        15px 0;

      color: white;

      font-family: inherit;

    }


    .file-input::file-selector-button {

      border: none;

      padding:
        10px 14px;

      margin-right: 10px;

      border-radius: 8px;

      background:
        #8b5cf6;

      color: white;

      cursor: pointer;

      font-family: inherit;

    }


    /* ================================
       MODAL BUTTONS
    ================================= */

    .modal-buttons {

      display: flex;

      justify-content: flex-end;

      gap: 10px;

      margin-top: 15px;

    }


    .cancel-button {

      background:
        #333;

    }


    .cancel-button:hover {

      background:
        #444;

    }


    /* ================================
       STATUS
    ================================= */

    .error {

      display: none;

      color:
        #ff6b6b;

      font-size: 14px;

      margin-bottom: 10px;

    }


    .upload-status {

      min-height: 20px;

      margin-top: 10px;

      font-size: 14px;

      opacity: 0.85;

    }


    .upload-status.success {

      color:
        #86efac;

    }


    .upload-status.error {

      display: block;

      color:
        #ff6b6b;

    }


    /* ================================
       LIGHTBOX
    ================================= */

    .lightbox {

      display: none;

      position: fixed;

      inset: 0;

      z-index: 2000;

      align-items: center;

      justify-content: center;

      padding: 20px;

      background:
        rgba(0, 0, 0, 0.92);

    }


    .lightbox.active {

      display: flex;

    }


    .lightbox img {

      max-width: 95vw;

      max-height: 90vh;

      object-fit: contain;

      border-radius: 10px;

      box-shadow:
        0 20px 60px
        rgba(0, 0, 0, 0.7);

    }


    .lightbox-close {

      position: fixed;

      top: 20px;

      right: 25px;

      width: 45px;

      height: 45px;

      padding: 0;

      border-radius: 50%;

      background:
        rgba(255, 255, 255, 0.12);

      font-size: 22px;

      z-index: 2001;

    }


    /* ================================
       MOBILE
    ================================= */

    @media (max-width: 600px) {

      body {

        padding: 15px;

      }


      .gallery-title {

        font-size: 25px;

      }


      .gallery-header {

        align-items:
          flex-start;

      }


      .gallery-actions {

        width: 100%;

      }


      .gallery-actions > * {

        flex: 1;

        text-align: center;

        justify-content:
          center;

      }


      .gallery {

        grid-template-columns:
          repeat(2, 1fr);

        gap: 10px;

      }


      .modal-box {

        padding: 20px;

      }

    }

  </style>

</head>

<body>


    <!-- ========================================
       MAIN GALLERY
  ======================================== -->

  <div class="gallery-container">


    <!-- HEADER -->

    <div class="gallery-header">

      <h1 class="gallery-title">

        <i class="fas fa-images"></i>

        Otokoi Gallery

      </h1>


      <div class="gallery-actions">


        <!-- BACK BUTTON -->

        <a
          href="index.html"
          class="back-button"
        >

          <i class="fas fa-arrow-left"></i>

          Back

        </a>


        <!-- UPLOAD BUTTON -->

        <button
          type="button"
          class="upload-button"
          id="uploadButton"
        >

          <i class="fas fa-upload"></i>

          Upload

        </button>


      </div>

    </div>


    <!-- ========================================
         GALLERY GRID
    ======================================== -->

    <div
      id="gallery"
      class="gallery"
    >

      <div class="loading-gallery">

        <i class="fas fa-spinner"></i>

        <p>
          Loading gallery...
        </p>

      </div>

    </div>


  </div>


  <!-- ========================================
       PASSWORD MODAL
  ======================================== -->

  <div
    class="modal"
    id="passwordModal"
  >

    <div class="modal-box">


      <h2>

        <i class="fas fa-lock"></i>

        Enter Password

      </h2>


      <p>

        Enter the password to
        upload an image.

      </p>


      <input
        type="password"
        id="passwordInput"
        class="password-input"
        placeholder="Password"
        autocomplete="off"
      >


      <div
        class="error"
        id="passwordError"
      >

        Incorrect password.

      </div>


      <div class="modal-buttons">


        <button
          type="button"
          class="cancel-button"
          id="cancelPassword"
        >

          Cancel

        </button>


        <button
          type="button"
          class="upload-button"
          id="confirmPassword"
        >

          Continue

        </button>


      </div>

    </div>

  </div>


  <!-- ========================================
       UPLOAD MODAL
  ======================================== -->

  <div
    class="modal"
    id="uploadModal"
  >

    <div class="modal-box">


      <h2>

        <i class="fas fa-cloud-upload-alt"></i>

        Upload Image

      </h2>


      <p>

        Select an image from your device.

      </p>


      <input
        type="file"
        id="imageInput"
        class="file-input"
        accept="image/jpeg,image/png,image/gif,image/webp,image/bmp"
      >


      <div
        class="upload-status"
        id="uploadStatus"
      ></div>


      <div class="modal-buttons">


        <button
          type="button"
          class="cancel-button"
          id="cancelUpload"
        >

          Cancel

        </button>


        <button
          type="button"
          class="upload-button"
          id="confirmUpload"
        >

          <i class="fas fa-upload"></i>

          Upload

        </button>


      </div>

    </div>

  </div>


  <!-- ========================================
       IMAGE LIGHTBOX
  ======================================== -->

  <div
    class="lightbox"
    id="lightbox"
  >


    <button
      type="button"
      class="lightbox-close"
      id="lightboxClose"
      title="Close"
    >

      <i class="fas fa-times"></i>

    </button>


    <img
      id="lightboxImage"
      src=""
      alt="Gallery image"
    >


  </div>


    <!-- ========================================
       SUPABASE LIBRARY
  ======================================== -->

  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
  </script>


  <script>


    /* ========================================
       SUPABASE CONNECTION
    ======================================== */

    const SUPABASE_URL =
      "https://ilsicycdxdutzrlgkuhw.supabase.co";


    const SUPABASE_KEY =
      "sb_publishable_n3s02qESCPzBeWc8tAKYGw_AGoN9_ls";


    const supabaseClient =
      supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    /* ========================================
       SETTINGS
    ======================================== */

    const BUCKET_NAME =
      "gallery";


    const UPLOAD_PASSWORD =
      "bilat";


    const MAX_FILE_SIZE =
      10 * 1024 * 1024;


    /* ========================================
       ELEMENTS
    ======================================== */

    const uploadButton =
      document.getElementById(
        "uploadButton"
      );


    const passwordModal =
      document.getElementById(
        "passwordModal"
      );


    const uploadModal =
      document.getElementById(
        "uploadModal"
      );


    const passwordInput =
      document.getElementById(
        "passwordInput"
      );


    const passwordError =
      document.getElementById(
        "passwordError"
      );


    const imageInput =
      document.getElementById(
        "imageInput"
      );


    const uploadStatus =
      document.getElementById(
        "uploadStatus"
      );


    const gallery =
      document.getElementById(
        "gallery"
      );


    const lightbox =
      document.getElementById(
        "lightbox"
      );


    const lightboxImage =
      document.getElementById(
        "lightboxImage"
      );


    const lightboxClose =
      document.getElementById(
        "lightboxClose"
      );


    /* ========================================
       OPEN PASSWORD MODAL
    ======================================== */

    uploadButton.addEventListener(
      "click",
      () => {

        passwordInput.value =
          "";

        passwordError.style.display =
          "none";

        passwordModal.classList.add(
          "active"
        );


        setTimeout(
          () => {

            passwordInput.focus();

          },
          100
        );

      }
    );


    /* ========================================
       CANCEL PASSWORD
    ======================================== */

    document
      .getElementById(
        "cancelPassword"
      )
      .addEventListener(
        "click",
        () => {

          passwordModal.classList.remove(
            "active"
          );

        }
      );


    /* ========================================
       CHECK PASSWORD
    ======================================== */

    document
      .getElementById(
        "confirmPassword"
      )
      .addEventListener(
        "click",
        () => {

          const password =
            passwordInput.value.trim();


          if (
            password ===
            UPLOAD_PASSWORD
          ) {


            passwordModal.classList.remove(
              "active"
            );


            uploadModal.classList.add(
              "active"
            );


            uploadStatus.textContent =
              "";


            uploadStatus.className =
              "upload-status";


          } else {


            passwordError.style.display =
              "block";


          }

        }
      );


    /* ========================================
       PASSWORD ENTER KEY
    ======================================== */

    passwordInput.addEventListener(
      "keydown",
      (event) => {

        if (
          event.key ===
          "Enter"
        ) {

          document
            .getElementById(
              "confirmPassword"
            )
            .click();

        }


        if (
          event.key ===
          "Escape"
        ) {

          passwordModal.classList.remove(
            "active"
          );

        }

      }
    );


    /* ========================================
       CANCEL UPLOAD
    ======================================== */

    document
      .getElementById(
        "cancelUpload"
      )
      .addEventListener(
        "click",
        () => {

          uploadModal.classList.remove(
            "active"
          );


          imageInput.value =
            "";


          uploadStatus.textContent =
            "";


          uploadStatus.className =
            "upload-status";

        }
      );


    /* ========================================
       UPLOAD BUTTON
    ======================================== */

    document
      .getElementById(
        "confirmUpload"
      )
      .addEventListener(
        "click",
        uploadImage
      );


    /* ========================================
       UPLOAD IMAGE FUNCTION
    ======================================== */

    async function uploadImage() {


      const file =
        imageInput.files[0];


      /* No file */

      if (!file) {

        uploadStatus.textContent =
          "Please select an image first.";

        uploadStatus.className =
          "upload-status error";

        return;

      }


      /* Check type */

      if (
        !file.type.startsWith(
          "image/"
        )
      ) {

        uploadStatus.textContent =
          "Please select a valid image.";

        uploadStatus.className =
          "upload-status error";

        return;

      }


      /* Check size */

      if (
        file.size >
        MAX_FILE_SIZE
      ) {

        uploadStatus.textContent =
          "Image must be smaller than 10 MB.";

        uploadStatus.className =
          "upload-status error";

        return;

      }


      uploadStatus.textContent =
        "Uploading...";


      uploadStatus.className =
        "upload-status";


      try {


        /* Get extension */

        const extension =
          file.name
            .split(".")
            .pop()
            .toLowerCase();


        /* Random filename */

        const randomPart =
          Math.random()
            .toString(36)
            .substring(
              2,
              10
            );


        const fileName =
          `${Date.now()}-${randomPart}.${extension}`;


        console.log(
          "Uploading:",
          fileName
        );


        /* ========================================
           SUPABASE STORAGE UPLOAD
        ======================================== */

        const {
          data,
          error
        } =
          await supabaseClient
            .storage
            .from(
              BUCKET_NAME
            )
            .upload(
              fileName,
              file,
              {

                cacheControl:
                  "3600",

                upsert:
                  false,

                contentType:
                  file.type

              }
            );


        /* ========================================
           ERROR
        ======================================== */

        if (error) {


          console.error(
            "Supabase upload error:",
            error
          );


          uploadStatus.textContent =
            "Upload failed: " +
            error.message;


          uploadStatus.className =
            "upload-status error";


          return;

        }


        console.log(
          "Upload successful:",
          data
        );


        /* ========================================
           SUCCESS
        ======================================== */

        uploadStatus.textContent =
          "Image uploaded successfully!";


        uploadStatus.className =
          "upload-status success";


        imageInput.value =
          "";


        /* Refresh gallery */

        await loadGallery();


        /* Close modal */

        setTimeout(
          () => {

            uploadModal.classList.remove(
              "active"
            );


            uploadStatus.textContent =
              "";


            uploadStatus.className =
              "upload-status";

          },
          1000
        );


      } catch (error) {


        console.error(
          "Unexpected upload error:",
          error
        );


        uploadStatus.textContent =
          "Something went wrong: " +
          error.message;


        uploadStatus.className =
          "upload-status error";

      }

    }
    /* ========================================
       LOAD GALLERY
    ======================================== */

    async function loadGallery() {


      gallery.innerHTML = `

        <div class="loading-gallery">

          <i class="fas fa-spinner"></i>

          <p>
            Loading gallery...
          </p>

        </div>

      `;


      try {


        const {
          data,
          error
        } =
          await supabaseClient
            .storage
            .from(
              BUCKET_NAME
            )
            .list(
              "",
              {

                limit: 100,

                offset: 0,

                sortBy: {

                  column:
                    "created_at",

                  order:
                    "desc"

                }

              }
            );


        /* ========================================
           SUPABASE ERROR
        ======================================== */

        if (error) {


          console.error(
            "Gallery loading error:",
            error
          );


          gallery.innerHTML = `

            <div class="empty-gallery">

              <i class="fas fa-triangle-exclamation"></i>

              <h2>
                Could not load gallery
              </h2>

              <p>
                ${escapeHtml(
                  error.message
                )}
              </p>

            </div>

          `;


          return;

        }


        /* ========================================
           NO IMAGES
        ======================================== */

        if (
          !data ||
          data.length === 0
        ) {


          gallery.innerHTML = `

            <div class="empty-gallery">

              <i class="fas fa-images"></i>

              <h2>
                No images yet
              </h2>

              <p>
                Upload an image to start the gallery.
              </p>

            </div>

          `;


          return;

        }


        /* Clear loading */

        gallery.innerHTML =
          "";


        /* ========================================
           CREATE GALLERY ITEMS
        ======================================== */

        data.forEach(
          (file) => {


            if (
              !file.name ||
              file.name.endsWith("/")
            ) {

              return;

            }


            /* Get public URL */

            const {
              data:
                publicUrlData
            } =
              supabaseClient
                .storage
                .from(
                  BUCKET_NAME
                )
                .getPublicUrl(
                  file.name
                );


            const imageUrl =
              publicUrlData.publicUrl;


            /* ========================================
               GALLERY ITEM
            ======================================== */

            const item =
              document.createElement(
                "div"
              );


            item.className =
              "gallery-item";


            /* ========================================
               IMAGE
            ======================================== */

            const image =
              document.createElement(
                "img"
              );


            image.src =
              imageUrl;


            image.alt =
              "Otokoi Gallery Image";


            image.loading =
              "lazy";


            /* ========================================
               OVERLAY
            ======================================== */

            const overlay =
              document.createElement(
                "div"
              );


            overlay.className =
              "image-overlay";


            overlay.innerHTML = `

              <i class="fas fa-expand"></i>

            `;


            /* Add image */

            item.appendChild(
              image
            );


            /* Add overlay */

            item.appendChild(
              overlay
            );


            /* ========================================
               OPEN LIGHTBOX
            ======================================== */

            item.addEventListener(
              "click",
              () => {


                lightboxImage.src =
                  imageUrl;


                lightbox.classList.add(
                  "active"
                );


              }
            );


            /* Add to gallery */

            gallery.appendChild(
              item
            );


          }
        );


      } catch (error) {


        console.error(
          "Gallery error:",
          error
        );


        gallery.innerHTML = `

          <div class="empty-gallery">

            <i class="fas fa-triangle-exclamation"></i>

            <h2>
              Something went wrong
            </h2>

            <p>
              Unable to load the gallery.
            </p>

          </div>

        `;

      }

    }


    /* ========================================
       ESCAPE HTML
    ======================================== */

    function escapeHtml(
      text
    ) {


      const div =
        document.createElement(
          "div"
        );


      div.textContent =
        text;


      return div.innerHTML;

    }


    /* ========================================
       CLOSE LIGHTBOX
    ======================================== */

    lightboxClose.addEventListener(
      "click",
      () => {

        closeLightbox();

      }
    );


    /* ========================================
       CLICK OUTSIDE LIGHTBOX
    ======================================== */

    lightbox.addEventListener(
      "click",
      (event) => {


        if (
          event.target ===
          lightbox
        ) {

          closeLightbox();

        }

      }
    );


    /* ========================================
       CLOSE LIGHTBOX FUNCTION
    ======================================== */

    function closeLightbox() {


      lightbox.classList.remove(
        "active"
      );


      lightboxImage.src =
        "";

    }




    document.addEventListener(
      "keydown",
      (event) => {


        if (
          event.key ===
          "Escape"
        ) {


          passwordModal.classList.remove(
            "active"
          );


          uploadModal.classList.remove(
            "active"
          );


          closeLightbox();

        }

      }
    );


    /* ========================================
       CLOSE PASSWORD MODAL
       WHEN CLICKING OUTSIDE
    ======================================== */

    passwordModal.addEventListener(
      "click",
      (event) => {


        if (
          event.target ===
          passwordModal
        ) {

          passwordModal.classList.remove(
            "active"
          );

        }

      }
    );


    /* ========================================
       CLOSE UPLOAD MODAL
       WHEN CLICKING OUTSIDE
    ======================================== */

    uploadModal.addEventListener(
      "click",
      (event) => {


        if (
          event.target ===
          uploadModal
        ) {

          uploadModal.classList.remove(
            "active"
          );

        }

      }
    );


    /* ========================================
       LOAD GALLERY ON PAGE LOAD
    ======================================== */

    loadGallery();


    /* ========================================
       CONNECTION TEST
    ======================================== */

    console.log(
      "Otokoi Gallery connected to Supabase!"
    );


  </script>

</body>

</html>
